name: Update S3 File List

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Cognito temporary credentials
        id: cognito
        run: |
          IDENTITY_POOL_ID="us-west-2:8ffe94a1-9042-4509-8e65-4efe16e61e3e"

          IDENTITY_ID=$(aws cognito-identity get-id \
            --identity-pool-id "$IDENTITY_POOL_ID" \
            --region us-west-2 \
            --query IdentityId \
            --output text)

          CREDS=$(aws cognito-identity get-credentials-for-identity \
            --identity-id "$IDENTITY_ID" \
            --region us-west-2)

          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretKey')" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

      - name: Generate files.json
        run: |
          aws s3api list-objects-v2 \
            --bucket superbucket123 \
            --region us-west-2 \
            --output json |
          jq '[
            .Contents[]? |
            {
              key: .Key,
              size: .Size,
              lastModified: .LastModified,
              etag: .ETag
            }
          ]' > files.json

      - name: Commit files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add files.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update files.json"
            git push
          fi
