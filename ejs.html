
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }

        #loading.hidden {
            display: none;
        }
    </style>
</head>

<body>

<div id="loading">Loading emulator...</div>
<div id="game"></div>

<script>
    const params = new URLSearchParams(window.location.search);

    const system = params.get("c");
    const rom = params.get("u");

    if (!system || !rom) {
        document.getElementById("loading").textContent =
            "Missing emulator or ROM.";
        throw new Error("Missing c or u parameter");
    }

    // EmulatorJS core mapping
    const cores = {
        atari2600: "atari2600",
        gb: "gambatte",
        gba: "mgba",
        gbc: "gambatte",
        n64: "mupen64plus_next",
        nds: "melonds",
        nes: "fceumm",
        psx: "pcsx_rearmed",
        sega: "genesis_plus_gx",
        segaMD: "genesis_plus_gx",
        snes: "snes9x",
        vb: "mednafen_vb"
    };

    const core = cores[system];

    if (!core) {
        document.getElementById("loading").textContent =
            "Unsupported system: " + system;
        throw new Error("Unsupported system: " + system);
    }

    // EmulatorJS configuration
    window.EJS_player = "#game";
    window.EJS_core = core;
    window.EJS_gameUrl = rom;

    // Where EmulatorJS loads its files from
    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    // Hide loading once EmulatorJS starts
    window.EJS_onGameStart = function () {
        document.getElementById("loading").classList.add("hidden");
    };

    // Load EmulatorJS
    const script = document.createElement("script");
    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onload = () => {
        console.log("EmulatorJS loaded");
    };

    script.onerror = () => {
        document.getElementById("loading").textContent =
            "Failed to load EmulatorJS.";
    };

    document.body.appendChild(script);
</script>

</body>
</html>
